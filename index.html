<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALLEN Aula — AI English Partner</title>
    <meta
      name="description"
      content="Real-time bidirectional voice English tutoring experience with a 3D virtual professor powered by Gemini Live API."
    />
    <meta property="og:title" content="ALLEN Aula — AI English Partner" />
    <meta
      property="og:description"
      content="Real-time bidirectional voice English tutoring experience with a 3D virtual professor powered by Gemini Live API."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var savedTheme = localStorage.getItem('allen_aula_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#070B16] dark:text-slate-100 antialiased selection:bg-blue-600/25 dark:selection:bg-blue-600/40 selection:text-slate-950 dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
